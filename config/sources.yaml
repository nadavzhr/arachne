microsoft:
  enabled: true
  url: https://apply.careers.microsoft.com/api/pcsx/search
  params:
    domain: microsoft.com
    query: software engineer
    location: Israel
    start: "0"
    filter_include_remote: "1"
    hl: en
    sort_by: relevance
    filter_profession: software engineering
    filter_seniority:
      - Entry
      - Mid-Level
  headers: {}
  filters:
    include_keywords: ["software", "engineer"]
    exclude_keywords: ["intern", "contract", "senior"]
    locations: ["Israel", "Remote"]

nvidia:
  enabled: true
  url: https://jobs.nvidia.com/api/pcsx/search
  params:
    domain: nvidia.com
    query: software engineering
    location: Israel
    start: "0"
    filter_include_remote: "1"
    filter_job_category: engineering
    filter_job_type: 
      - new college graduate
      - regular employee
    filter_time_type: full time
    sort_by: relevance
  headers: {}
  filters:
    include_keywords: ["software", "engineer"]
    exclude_keywords: ["intern", "contract", "senior"]
    locations: ["Israel", "Remote"]

amazon:
  enabled: true
  url: https://www.amazon.jobs/en/search.json
  params:
    category:
      - software-development
    schedule_type_id:
      - Full-Time
    normalized_country_code:
      - ISR
    industry_experience:
      - one_to_three_years
    loc_query: Israel
    result_limit: "100"
    offset: "0"
    sort: relevant
  headers: {}
  filters:
    include_keywords: ["software", "engineer"]
    exclude_keywords: ["intern", "contract", "senior"]
    locations: ["Israel", "Remote"]

google:
  enabled: true
  url: https://www.google.com/about/careers/applications/jobs/results
  params:
    location:
      - Israel
      - Haifa, Israel
      - Tel Aviv, Israel
    target_level:
      - EARLY
    employment_type: FULL_TIME
  headers: {}
  filters:
    include_keywords: ["software", "engineer"]
    exclude_keywords: ["intern", "contract", "senior"]
    locations: ["Israel", "Remote"]

apple:
  enabled: true
  url: https://jobs.apple.com/en-il/search
  params:
    location:
      - israel-ISR
    key: software engineer
    language: en-il
  headers: {}
  filters:
    include_keywords: ["software", "engineer"]
    exclude_keywords: ["intern", "contract", "senior"]
    locations: ["Israel", "Remote"]
