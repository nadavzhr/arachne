[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[project]
name = "arachne"
version = "0.1.0"
description = "A job scraping aggregator for public tech company listings."
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
arachne = "arachne.runner:run_sync"

[dependency-groups]
dev = [
  "coverage>=7.0,<8.0",
  "hypothesis>=6.0,<7.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["arachne"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/arachne"]

[tool.coverage.report]
fail_under = 80
show_missing = true
