name: Scrape and Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: ["main"]
    paths:
      - 'ui/**'
      - 'src/**'
      - 'config/**'
      - 'profiles/**'
      - '.github/workflows/scrape-jobs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Run Scraper
        run: uv run arachne run --no-export

      - name: Export UI data
        run: |
          uv run arachne export \
            --output ui/public/jobs.json \
            --analytics-output ui/public/analytics.json \
            --config-output ui/public/system_config.json

      - name: Validate UI exports
        run: |
          test -f ui/public/jobs.json
          test -f ui/public/analytics.json
          test -f ui/public/system_config.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Build
        run: cd ui && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ui/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
