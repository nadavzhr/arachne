services:
  app:
    build:
      context: .
    
    working_dir: /app

    # We override the ENTRYPOINT from the Dockerfile to allow 
    # running arbitrary bash commands in development.
    entrypoint: []

    volumes:
      - .:/app
      - ./data:/app/data
      # 💡 Pro Tip: This "Anonymous Volume" hides your host's .venv 
      # from the container, so Docker uses its own internal one!
      - /app/.venv

    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1

    command: >
      bash -c "
      uv sync --dev &&
      uv run arachne run
      "

    tty: true
