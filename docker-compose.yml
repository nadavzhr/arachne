version: "3.9"

services:
  app:
    build:
      context: .
      target: dev
    
    working_dir: /app

    volumes:
      - .:/app
      - ./data:/app/data
      # 💡 Pro Tip: This "Anonymous Volume" hides your host's .venv 
      # from the container, so Docker uses its own internal one!
      - /app/.venv

    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1

    command: >
      bash -c "
      uv sync --dev &&
      uv run arachne run
      "

    tty: true
